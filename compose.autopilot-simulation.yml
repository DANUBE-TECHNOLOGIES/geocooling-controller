services:
  backend:
    environment:
      GEOCOOLING_AUTOPILOT_ENABLED: "true"
      GEOCOOLING_AUTOPILOT_ALLOW_REAL_DRIVER: "false"
      GEOCOOLING_AUTOPILOT_INTERVAL_SECONDS: "10"

      GEOCOOLING_MIN_ON_SECONDS: "0"
      GEOCOOLING_MIN_OFF_SECONDS: "0"

      GEOCOOLING_VALVE_OPEN_DELAY: "1"
      GEOCOOLING_VALVE_CLOSE_DELAY: "1"
