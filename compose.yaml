name: smart-building-controller

services:
  postgres:
    image: postgres:16-alpine
    container_name: sbc-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: ${TZ}
    volumes:
      - sbc_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - sbc

  backend:
    env_file:
      - .env
    build:
      context: ./backend
    container_name: sbc-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_VERSION: 0.6.7
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      MQTT_HOST: ${MQTT_HOST}
      MQTT_PORT: ${MQTT_PORT}
      MQTT_USERNAME: ${MQTT_USERNAME}
      MQTT_PASSWORD: ${MQTT_PASSWORD}
      MQTT_TOPICS: ${MQTT_TOPICS}
      LOG_LEVEL: ${LOG_LEVEL}
      TZ: ${TZ}
    extra_hosts:
      - host.docker.internal:host-gateway
    ports:
      - "${SBC_API_PORT}:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen("http://127.0.0.1:8000/health/live", timeout=3)
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    volumes:
      - ./data/geocooling:/var/lib/geocooling
    networks:
      - sbc

  adminer:
    image: adminer:4
    container_name: sbc-adminer
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    ports:
      - "${ADMINER_PORT}:8080"
    networks:
      - sbc

networks:
  sbc:
    name: sbc-network

volumes:
  sbc_postgres_data:
    name: sbc_postgres_data
