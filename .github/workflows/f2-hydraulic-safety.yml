name: F2 Hydraulic Safety

on:
  push:
    branches:
      - feature/geocooling-ui-v1
    paths:
      - 'backend/app/geocooling/controller.py'
      - 'backend/app/geocooling/controller_base.py'
      - 'backend/app/geocooling/waveshare_modbus_driver.py'
      - 'backend/tests/test_f2_controller_hydraulic_hardening.py'
      - 'backend/tests/test_geocooling_c019_sequence.py'
      - 'backend/tests/test_geocooling_waveshare_modbus_driver.py'
      - '.github/workflows/f2-hydraulic-safety.yml'
  workflow_dispatch:

jobs:
  hydraulic-safety:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Run F2 hydraulic regression tests
        env:
          PYTHONPATH: .
        run: |
          pytest -q \
            tests/test_f2_controller_hydraulic_hardening.py \
            tests/test_geocooling_c019_sequence.py \
            tests/test_geocooling_waveshare_modbus_driver.py
