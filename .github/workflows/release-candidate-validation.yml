name: GeoCooling Release Candidate Validation

on:
  push:
    branches:
      - feature/geocooling-ui-v1
  workflow_dispatch:

jobs:
  backend-regression:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: RC1 RC2 RC3 regression
        env:
          PYTHONPATH: .
        run: |
          pytest -q \
            tests/test_rc1_architecture.py \
            tests/test_rc1_pipeline.py \
            tests/test_decision_context_v1.py \
            tests/test_decision_context_builder_v1.py \
            tests/test_decision_context_live_v1.py \
            tests/test_scenario_engine_v1.py \
            tests/test_scenario_engine_live_v1.py \
            tests/test_rc3_architecture.py \
            tests/test_rc3_shadow.py \
            tests/test_rc3_live_shadow.py \
            tests/test_weather_inertia_predictor.py \
            tests/test_weather_inertia_live_integration.py \
            tests/test_precooling_advisor.py \
            tests/test_predictor_calibration.py \
            tests/test_prediction_validation.py \
            tests/test_validation_calibration_bridge.py

      - name: F2 F3 F4 safety regression
        env:
          PYTHONPATH: .
        run: |
          pytest -q \
            tests/test_f2_controller_hydraulic_hardening.py \
            tests/test_f3_thermal_fail_closed.py \
            tests/test_f4_device_readiness.py \
            tests/test_geocooling_c019_sequence.py \
            tests/test_geocooling_waveshare_modbus_driver.py \
            tests/test_geocooling_telemetry_health.py \
            tests/test_telemetry_health_service.py \
            tests/test_surface_estimation.py \
            tests/test_esphome_native_bridge.py \
            tests/test_commissioning_readiness.py \
            tests/test_hardware_activation_policy.py \
            tests/test_commissioning_test_gate.py \
            tests/test_commissioning_test_manager_policy_gate.py \
            tests/test_hardware_manual_control_commissioning_gate.py \
            tests/test_direct_relay_policy_gate.py \
            tests/test_release_readiness.py \
            tests/test_safe_home_assistant_bridge.py

      - name: Passive audit script syntax
        run: |
          bash -n ../scripts/audit/geocooling-telemetry-mapping.sh
          bash -n ../scripts/audit/geocooling-esphome-mqtt-diagnostic.sh
          bash -n ../scripts/audit/geocooling-physical-sensor-identification.sh
          bash -n ../scripts/deploy/enable-esphome-native-bridge.sh
          bash -n ../scripts/deploy/enable-installed-telemetry-profile.sh
          bash -n ../scripts/deploy/confirm-installed-sensor-identification.sh
          bash -n ../scripts/deploy/validate-weather-anticipation.sh
          bash -n ../scripts/deploy/configure-weather-location.sh
          bash -n ../scripts/deploy/validate-precooling-advisory.sh
          bash -n ../scripts/commissioning/field-certification-preflight.sh
          bash -n ../scripts/rc3/start-precooling-journal.sh
          bash -n ../scripts/rc3/status-precooling-journal.sh
          bash -n ../scripts/rc3/stop-precooling-journal.sh
          bash -n ../scripts/rc3/analyze-precooling-journal.sh
          bash -n ../scripts/rc3/calibrate-precooling-journal.sh
          bash -n ../scripts/release/geocooling-final-readiness-audit.sh
          bash -n ../scripts/release/deploy-final-software-stack.sh
          python -m py_compile ../tools/rc3/precooling_advisory_collector.py
          python -m py_compile ../tools/rc3/analyze_precooling_journal.py
          python -m py_compile ../tools/rc3/calibrate_precooling_journal.py

      - name: Compose configuration
        env:
          POSTGRES_DB: sbc
          POSTGRES_USER: sbc
          POSTGRES_PASSWORD: ci
          TZ: Europe/Paris
          SBC_API_PORT: '8000'
          GEOCOOLING_UI_PORT: '3000'
          ADMINER_PORT: '8081'
          MQTT_HOST: localhost
          MQTT_PORT: '1883'
          MQTT_USERNAME: ci
          MQTT_PASSWORD: ci
          MQTT_TOPICS: 'geocooling/#'
          LOG_LEVEL: INFO
          ESPHOME_BRIDGE_NOISE_PSK: ci
        run: |
          cp ../.env.example ../.env
          trap 'rm -f ../.env' EXIT
          docker compose -f ../compose.yaml config -q

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/geocooling-ui
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/geocooling-ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Build production container
        run: docker build --build-arg NEXT_PUBLIC_GEOCOOLING_API_URL=/api -t geocooling-ui-ci .
